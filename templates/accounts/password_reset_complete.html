{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg text-center" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                     style="width: 80px; height: 80px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); border-radius: 50%;">
                    <i class="bi bi-shield-check text-white" style="font-size: 40px;"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Changed!</h3>
                <p class="text-muted small mb-4">
                    Your password has been reset successfully. You can now login with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn text-white fw-semibold"
                   style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; padding: 10px 30px;">
                    <i class="bi bi-box-arrow-in-right"></i> Login Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
