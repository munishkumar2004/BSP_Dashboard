{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-5">
                
                <!-- Icon and Heading -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%;">
                        <i class="bi bi-shield-lock-fill text-white" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Login to access your dashboard</p>
                </div>

                <!-- 🟢 Social Login Buttons -->
                <div class="d-grid gap-2 mb-4">
                    <button type="button" class="btn btn-outline-dark btn-lg fw-semibold" 
                            onclick="alert('Google Login is coming soon! BSP SSO integration pending.')"
                            style="border-radius: 10px;">
                        <i class="bi bi-google"></i> Continue with Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-lg fw-semibold" 
                            onclick="alert('BSP SSO integration pending. Please contact your IT department.')"
                            style="border-radius: 10px;">
                        <i class="bi bi-building"></i> Continue with SSO
                    </button>
                </div>

                <!-- Divider -->
                <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1">
                    <span class="px-3 text-muted small">OR CONTINUE WITH EMAIL</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- Email/Password Form -->
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-primary"></i> Username
                        </label>
                        <input type="text" name="username" class="form-control form-control-lg" 
                               placeholder="Enter your username" required style="border-radius: 10px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-key-fill text-primary"></i> Password
                        </label>
                        <div class="position-relative">
                            <input type="password" name="password" id="passwordField" 
                                   class="form-control form-control-lg" 
                                   placeholder="Enter your password" required 
                                   style="border-radius: 10px; padding-right: 45px;">
                            <button type="button" onclick="togglePassword()" 
                                    class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent">
                                <i class="bi bi-eye-slash" id="eyeIcon" style="font-size: 18px; color: #764ba2;"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">
                                Remember Me
                            </label>
                        </div>
                        <a href="{% url 'password_reset' %}" class="small text-decoration-none" style="color: #764ba2;">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" 
                            class="btn btn-lg w-100 text-white fw-semibold"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                                   border: none; border-radius: 10px; transition: all 0.3s ease;"
                            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 25px rgba(102, 126, 234, 0.5)';"
                            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <i class="bi bi-box-arrow-in-right"></i> Login with Email
                    </button>
                </form>

                <!-- Signup Link -->
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        Don't have an account? 
                        <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none" style="color: #764ba2;">
                            Sign Up <i class="bi bi-arrow-right"></i>
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    var field = document.getElementById('passwordField');
    var icon = document.getElementById('eyeIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    } else {
        field.type = 'password';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    }
}
</script>
{% endblock %}
