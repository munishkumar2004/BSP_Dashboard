{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%;">
                        <i class="bi bi-key-fill text-white" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Set New Password</h3>
                </div>
                {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="new_password1" class="form-control form-control-lg" 
                               placeholder="Enter new password" required style="border-radius: 10px;">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="new_password2" class="form-control form-control-lg" 
                               placeholder="Re-enter password" required style="border-radius: 10px;">
                    </div>
                    <button type="submit" class="btn btn-lg w-100 text-white fw-semibold"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px;">
                        <i class="bi bi-check-lg"></i> Change Password
                    </button>
                </form>
                {% else %}
                <div class="alert alert-danger">This reset link is invalid or expired.</div>
                <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">Request New Link</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
