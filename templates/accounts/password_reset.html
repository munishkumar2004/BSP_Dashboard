{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="content-card shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-4 p-md-5">
                
                <!-- Icon and Heading -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%;">
                        <i class="bi bi-envelope-fill text-white" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Password?</h3>
                    <p class="text-muted small">Reset your password securely</p>
                </div>

                <!-- 🟢 Toggle Buttons (Email vs Phone) -->
                <div class="d-flex justify-content-center mb-4 gap-3">
                    <button type="button" class="btn btn-sm w-50 fw-semibold active-tab" id="tabEmail" onclick="switchTab('email')" style="background: rgba(102,126,234,0.2); color: #fff; border: 1px solid #667eea;">
                        <i class="bi bi-envelope"></i> Via Email
                    </button>
                    <button type="button" class="btn btn-sm w-50 fw-semibold" id="tabPhone" onclick="switchTab('phone')" style="background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1);">
                        <i class="bi bi-phone"></i> Via Phone
                    </button>
                </div>

                <!-- 🟢 EMAIL FORM (Default) -->
                <div id="sectionEmail">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-envelope-fill text-primary"></i> Registered Email
                            </label>
                            <input type="email" name="email" class="form-control form-control-lg" 
                                   placeholder="Enter your email address" required style="border-radius: 10px;">
                        </div>
                        <button type="submit" class="btn btn-lg w-100 text-white fw-semibold"
                                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px;">
                            <i class="bi bi-send-fill"></i> Send Reset Link
                        </button>
                    </form>
                </div>

                <!-- 🟢 PHONE FORM (Hidden by default) -->
                <div id="sectionPhone" style="display: none;">
                    <div class="alert alert-info" style="background: rgba(23, 162, 184, 0.1); border: 1px solid rgba(23, 162, 184, 0.3); color: #fff;">
                        <i class="bi bi-info-circle"></i> SMS Gateway (Twilio) integration is pending. Please use Email for now.
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-phone-fill text-primary"></i> Registered Phone Number
                        </label>
                        <input type="tel" class="form-control form-control-lg" 
                               placeholder="+91 XXXXX XXXXX" disabled style="border-radius: 10px;">
                    </div>
                    <button type="button" class="btn btn-lg w-100 text-white fw-semibold" disabled
                            style="background: #475569; border: none; border-radius: 10px; cursor: not-allowed;">
                        <i class="bi bi-shield-lock"></i> Send OTP (Coming Soon)
                    </button>
                </div>

                <!-- Back to Login Link -->
                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-decoration-none" style="color: #94a3b8;">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function switchTab(type) {
        var tabEmail = document.getElementById('tabEmail');
        var tabPhone = document.getElementById('tabPhone');
        var sectionEmail = document.getElementById('sectionEmail');
        var sectionPhone = document.getElementById('sectionPhone');

        if (type === 'email') {
            // Activate Email
            tabEmail.style.background = 'rgba(102,126,234,0.2)';
            tabEmail.style.color = '#fff';
            tabEmail.style.border = '1px solid #667eea';
            
            // Deactivate Phone
            tabPhone.style.background = 'transparent';
            tabPhone.style.color = '#94a3b8';
            tabPhone.style.border = '1px solid rgba(255,255,255,0.1)';

            sectionEmail.style.display = 'block';
            sectionPhone.style.display = 'none';
        } else {
            // Activate Phone
            tabPhone.style.background = 'rgba(102,126,234,0.2)';
            tabPhone.style.color = '#fff';
            tabPhone.style.border = '1px solid #667eea';
            
            // Deactivate Email
            tabEmail.style.background = 'transparent';
            tabEmail.style.color = '#94a3b8';
            tabEmail.style.border = '1px solid rgba(255,255,255,0.1)';

            sectionEmail.style.display = 'none';
            sectionPhone.style.display = 'block';
        }
    }
</script>
{% endblock %}
