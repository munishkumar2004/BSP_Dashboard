{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%;">
                        <i class="bi bi-envelope-fill text-white" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Password?</h3>
                    <p class="text-muted small">Enter your email to reset your password</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-envelope-fill text-primary"></i> Email
                        </label>
                        <input type="email" name="email" class="form-control form-control-lg" 
                               placeholder="Enter your email" required style="border-radius: 10px;">
                    </div>
                    <button type="submit" class="btn btn-lg w-100 text-white fw-semibold"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px;">
                        <i class="bi bi-send-fill"></i> Send Reset Link
                    </button>
                </form>
                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="small text-decoration-none" style="color: #764ba2;">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
