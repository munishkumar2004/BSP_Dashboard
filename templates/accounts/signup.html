{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
            <div class="card-body p-5">
                <!-- Icon and Heading -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); border-radius: 50%;">
                        <i class="bi bi-person-plus-fill text-white" style="font-size: 32px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Join BSP Dashboard today</p>
                </div>

                <!-- Signup Form -->
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-success"></i> Username
                        </label>
                        <input type="text" name="username" class="form-control form-control-lg" 
                               placeholder="Choose a username" required 
                               style="border-radius: 10px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-key-fill text-success"></i> Password
                        </label>
                        <input type="password" name="password1" class="form-control form-control-lg" 
                               placeholder="Minimum 8 characters" required 
                               style="border-radius: 10px;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-shield-check text-success"></i> Confirm Password
                        </label>
                        <input type="password" name="password2" class="form-control form-control-lg" 
                               placeholder="Re-enter password" required 
                               style="border-radius: 10px;">
                    </div>

                    <button type="submit" 
                            class="btn btn-lg w-100 text-white fw-semibold"
                            style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); 
                                   border: none; border-radius: 10px; transition: all 0.3s ease;"
                            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 25px rgba(40, 167, 69, 0.5)';"
                            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <i class="bi bi-person-plus"></i> Create Account
                    </button>
                </form>

                <!-- Login Link -->
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        Already have an account? 
                        <a href="{% url 'login' %}" class="fw-semibold text-decoration-none" 
                           style="color: #28a745;">
                            Login <i class="bi bi-arrow-right"></i>
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
