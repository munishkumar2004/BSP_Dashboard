<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.25) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 1.3rem;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #fff !important;
            transform: translateY(-1px);
        }
        .main-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 70vh;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">
                <i class="bi bi-bar-chart-fill"></i> BSP Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto align-items-center">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'dataset_list' %}">
                            <i class="bi bi-folder2-open"></i> My Datasets
                        </a>
                        <a class="nav-link" href="{% url 'dashboard' %}">
                            <i class="bi bi-cloud-upload"></i> Upload
                        </a>
                        <a class="nav-link" href="{% url 'merge_datasets' %}">
                            <i class="bi bi-intersect"></i> Merge
                        </a>
                        {% if user.is_superuser %}
                            <a class="nav-link" href="/admin/">
                                <i class="bi bi-shield-lock-fill"></i> Admin Panel
                            </a>
                        {% endif %}
                        <a class="nav-link" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </a>
                        <a class="nav-link" href="{% url 'signup' %}">
                            <i class="bi bi-person-plus"></i> Signup
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <script>
        function showSpinner(btnId, loadingText) {
            var btn = document.getElementById(btnId);
            if (btn) {
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> ' + loadingText;
                btn.disabled = true;
                btn.classList.add('disabled');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
