{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="content-card">
            <h4 class="page-title"><i class="bi bi-mic-fill text-primary"></i> Upload Audio</h4>
            <p class="page-subtitle">Upload an audio file for automatic transcription and analysis</p>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Choose Audio</label>
                    <input type="file" name="audio_file" class="form-control" 
                           accept="audio/*" required>
                    <small class="text-muted">Supported: MP3, WAV, M4A, OGG, FLAC</small>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-upload"></i> Upload & Analyze
                </button>
            </form>

            <div class="alert alert-info mt-3 mb-0">
                <small>
                    <i class="bi bi-info-circle"></i> 
                    First time analysis takes longer (Whisper model download ~140 MB). 
                    Subsequent analyses will be faster.
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
