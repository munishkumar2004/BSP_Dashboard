name: Django CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # MySQL service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Bsp@2026
          MYSQL_DATABASE: bsp_dashboard_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: 📚 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⏳ Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -pBsp@2026 --silent && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: 🔧 Run migrations
        env:
          SECRET_KEY: 'django-insecure-test-key-for-ci'
          DEBUG: 'True'
          GROQ_API_KEY: 'dummy-test-key'
          DATABASE_URL: 'mysql://root:Bsp%402026@127.0.0.1:3306/bsp_dashboard_db'
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: 🧪 Run tests
        env:
          SECRET_KEY: 'django-insecure-test-key-for-ci'
          DEBUG: 'True'
          GROQ_API_KEY: 'dummy-test-key'
          DATABASE_URL: 'mysql://root:Bsp%402026@127.0.0.1:3306/bsp_dashboard_db'
        run: |
          python manage.py test -v 2

      - name: ✅ Tests passed
        if: success()
        run: echo "All tests passed successfully! 🎉"

      - name: ❌ Tests failed
        if: failure()
        run: echo "Some tests failed. Please check the logs above."